<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив ролевых сюжетов</title>
    <style>
        :root {
            --bg-color1: #1a1a2e;
            --bg-color2: #16213e;
            --bg-color3: #0f3460;
            --bg-color4: #533483;
            --font-family: 'Segoe UI', system-ui, sans-serif;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --btn-color1: #6a4c93;
            --btn-color2: #9381ff;
            --accent-color: #9381ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-family);
            color: var(--text-color);
            min-height: 100vh;
            background: linear-gradient(-45deg, var(--bg-color1), var(--bg-color2), var(--bg-color3), var(--bg-color4));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #app { max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
        h1 { text-align: center; margin: 30px 0; font-size: 2em; font-weight: 700; }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px var(--accent-color);
        }
        .card-preview-img {
            width: 100%; aspect-ratio: 16/9; object-fit: cover;
            border-radius: 12px; margin-bottom: 10px;
        }
        .card h3 { margin-bottom: 8px; }
        .card p { font-size: 0.85em; opacity: 0.8; }
        .btn {
            position: relative; overflow: hidden;
            padding: 12px 28px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--btn-color1), var(--btn-color2));
            color: #fff; font-size: 16px; cursor: pointer;
            display: block; margin: 20px auto; font-family: inherit;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .btn-danger { background: linear-gradient(135deg, #c9184a, #ff4d6d); }
        .btn-save { background: linear-gradient(135deg, #2d6a4f, #52b78a); }
        .form-box {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; padding: 30px; width: 90%; max-width: 500px;
            max-height: 90vh; overflow-y: auto;
        }
        .form-box input[type="text"], .form-box textarea, .form-box input[type="password"] {
            width: 100%; padding: 10px; margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            background: rgba(255,255,255,0.05); color: #fff;
            font-size: 15px; font-family: inherit;
        }
        .form-box label { display: block; margin-bottom: 5px; opacity: 0.8; font-size: 14px; }
        .form-box textarea { min-height: 100px; resize: vertical; }
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-width: 600px; margin: 0 auto 20px;
        }
        .image-gallery img {
            width: 100%; object-fit: cover; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15); cursor: pointer;
        }
        .back-btn {
            position: fixed; top: 20px; left: 20px; z-index: 50;
            background: none; border: 1px solid rgba(255,255,255,0.3);
            color: #fff; border-radius: 8px; padding: 8px 16px; cursor: pointer;
        }
        .admin-badge {
            position: fixed; top: 20px; right: 20px; z-index: 50;
            background: rgba(147, 129, 255, 0.3);
            border: 1px solid rgba(147, 129, 255, 0.5);
            border-radius: 20px; padding: 6px 16px; font-size: 13px;
        }
        .empty-state { text-align: center; padding: 40px; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="admin-btn-container"></div>
    <div id="app"></div>

    <script>
        const CONFIG = {
            owner: 'SphinssaCat',
            repo: 'Rolka_archive',
            branch: 'main',
            dataFile: 'data.json',
            adminPassword: '222745547Grr'
        };

        let state = { mode: 'list', data: null, user: { isAdmin: false, token: '' } };

        function uuid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
        function rawUrl(path) { return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`; }

        async function fetchRaw(path) {
            const res = await fetch(rawUrl(path));
            if (!res.ok) throw new Error('Not found');
            return await res.json();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatDescription(text) {
            if (!text) return '<p style="opacity:0.5">Описание не задано.</p>';
            return text.split(/\r?\n/).filter(l => l.trim() !== '').map(l => '<p>' + escapeHtml(l) + '</p>').join('');
        }

        function renderGallery(photos) {
            if (!photos || photos.length === 0) return '';
            return '<div class="image-gallery">' + photos.map(url => `
                <img src="${escapeHtml(url)}" alt="Фото" onclick="window.open('${escapeHtml(url)}','_blank')" onerror="this.style.display='none'">
            `).join('') + '</div>';
        }

        const GH = {
            async getToken() { return localStorage.getItem('gh_token'); },
            async setToken(token) { localStorage.setItem('gh_token', token); state.user.token = token; },
            headers() {
                const token = state.user.token;
                return {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': token ? `token ${token}` : '',
                    'Content-Type': 'application/json'
                };
            },
            async uploadImage(file, folder = 'images') {
                const reader = new FileReader();
                return new Promise((resolve, reject) => {
                    reader.readAsDataURL(file);
                    reader.onload = async () => {
                        try {
                            const blob = reader.result.split(',')[1];
                            const ext = file.name.split('.').pop().toLowerCase();
                            if (!['jpg','jpeg','png','gif','webp'].includes(ext)) throw new Error('Неподдерживаемый формат');
                            const path = `${folder}/${uuid()}.${ext}`;
                            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, {
                                method: 'PUT',
                                headers: this.headers(),
                                body: JSON.stringify({ message: 'Upload image', content: blob })
                            });
                            if (!res.ok) throw new Error('Upload failed');
                            const data = await res.json();
                            resolve(rawUrl(path));
                        } catch (e) { reject(e); }
                    };
                    reader.onerror = reject;
                });
            },
            async updateFile(path, content) {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, { headers: this.headers() });
                if (!res.ok && res.status !== 404) throw new Error('Cannot get file info');
                const info = res.status === 404 ? null : await res.json();

                const payload = {
                    message: 'Update file',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                    branch: CONFIG.branch
                };
                if (info) payload.sha = info.sha;

                const putRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: this.headers(),
                    body: JSON.stringify(payload)
                });
                if (!putRes.ok) {
                    const err = await putRes.json();
                    throw new Error(err.message || 'Update failed');
                }
                return true;
            }
        };

        function renderAdminBadge() {
            const container = document.getElementById('admin-btn-container');
            container.innerHTML = state.user.isAdmin
                ? `<div class="admin-badge">👑 Админ <button onclick="logout()" style="background:none;border:none;color:#fff;cursor:pointer;">Выйти</button></div>`
                : `<button class="back-btn" onclick="route('admin-login')">Войти как админ</button>`;
        }

        function renderList() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!state.data || !state.data.stories || state.data.stories.length === 0) {
                app.innerHTML = '<div class="empty-state">Нет сюжетов</div>';
            } else {
                app.innerHTML += `<h1>Сюжеты</h1><div class="cards-grid"></div>`;
                const grid = app.querySelector('.cards-grid');
                grid.innerHTML = state.data.stories.map(s => `
                    <div class="card" onclick="openStory('${s.id}')">
                        ${s.preview ? `<img src="${escapeHtml(s.preview)}" class="card-preview-img" onerror="this.style.display='none'">` : ''}
                        <h3>${escapeHtml(s.title)}</h3>
                        <p>${escapeHtml(s.description)}</p>
                    </div>
                `).join('');
            }

            if (state.user.isAdmin) {
                const btnContainer = document.createElement('div');
                btnContainer.style.marginTop = '20px';
                btnContainer.innerHTML = `<button class="btn btn-save" onclick="route('admin-panel')">+ Добавить сюжет</button>`;
                app.appendChild(btnContainer);
            }
        }

        function openStory(id) {
            const story = (state.data?.stories || []).find(s => s.id === id);
            if (!story) return;
            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route()">← Назад</button>
                <h1>${escapeHtml(story.title)}</h1>
                <p class="description-block"><strong>Описание:</strong> ${escapeHtml(story.description)}</p>
                <div class="description-block">${formatDescription(story.text)}</div>
                ${renderGallery(story.photos)}
            `;
        }

        function renderLoginForm() {
            document.getElementById('app').innerHTML = `
                <h1>Вход админа</h1>
                <div class="form-box">
                    <label>Пароль админа</label>
                    <input type="password" id="admin-pass" placeholder="Пароль из CONFIG">
                    <button class="btn" onclick="checkAdminPassword()">Войти</button>
                    <div id="login-error" style="color:#ff4d6d;margin-top:10px;text-align:center;"></div>
                </div>
            `;
        }

        function renderEditForm(story) {
            const photosHtml = (story?.photos || []).map((url, i) => `
                <div style="position:relative;display:inline-block;margin:4px;">
                    <img src="${escapeHtml(url)}" style="width:80px;border-radius:8px;" onerror="this.style.display='none'">
                    <button onclick="removePhoto(${i})" style="position:absolute;top:-6px;right:-6px;background:#ff4d6d;border:none;color:#fff;border-radius:50%;width:20px;height:20px;">×</button>
                </div>
            `).join('');

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route()">← Назад</button>
                <h1>${story ? 'Редактировать сюжет' : 'Новый сюжет'}</h1>
                <div class="form-box">
                    <label>Название</label>
                    <input type="text" id="story-title" placeholder="Например: Пролог: первая встреча">
                    <label>Краткое описание (для карточки)</label>
                    <input type="text" id="story-desc" placeholder="1–2 предложения">
                    <label>Полный текст сюжета</label>
                    <textarea id="story-text" placeholder="Полный текст сюжета..."></textarea>
                    <label>Фото (можно загрузить несколько)</label>
                    <input type="file" id="story-photos" multiple accept="image/*" style="margin-bottom:10px;">
                    <div id="uploaded-photos-preview" style="margin-bottom:15px;">${photosHtml}</div>
                    ${story ? `<button class="btn btn-danger" onclick="deleteStory('${story.id}')" style="width:100%;margin-top:10px;">Удалить сюжет</button>` : ''}
                    <button class="btn btn-save" onclick="saveStory()">${story ? 'Сохранить изменения' : 'Создать сюжет'}</button>
                </div>
            `;

            if (story) {
                document.getElementById('story-title').value = story.title;
                document.getElementById('story-desc').value = story.description;
                document.getElementById('story-text').value = story.text || '';
            }
        }

        let tempPhotos = []; // храним загруженные файлы до сохранения

        document.addEventListener('DOMContentLoaded', () => {
            const photosInput = document.getElementById('story-photos');
            if (photosInput) {
                photosInput.addEventListener('change', async (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;

                    const previewContainer = document.getElementById('uploaded-photos-preview');
                    // показываем индикатор загрузки
                    previewContainer.innerHTML = '<p style="color:#9381ff;">Загружаем фото…</p>';

                    try {
                        for (const file of files) {
                            const url = await GH.uploadImage(file);
                            tempPhotos.push(url);
                        }
                        renderPhotosPreview();
                    } catch (err) {
                        console.error(err);
                        alert('Ошибка загрузки фото: ' + err.message);
                        renderPhotosPreview();
                    } finally {
                        e.target.value = ''; // сброс инпута
                    }
                });
            }
        });

        function renderPhotosPreview() {
            const container = document.getElementById('uploaded-photos-preview');
            container.innerHTML = tempPhotos.map((url, i) => `
                <div style="position:relative;display:inline-block;margin:4px;">
                    <img src="${escapeHtml(url)}" style="width:80px;border-radius:8px;" onerror="this.style.display='none'">
                    <button onclick="removePhoto(${i})" style="position:absolute;top:-6px;right:-6px;background:#ff4d6d;border:none;color:#fff;border-radius:50%;width:20px;height:20px;">×</button>
                </div>
            `).join('');
        }

        function removePhoto(index) {
            tempPhotos.splice(index, 1);
            renderPhotosPreview();
        }

        async function saveStory() {
            const title = document.getElementById('story-title').value.trim();
            const desc = document.getElementById('story-desc').value.trim();
            const text = document.getElementById('story-text').value.trim();

            if (!title || !desc) {
                alert('Название и краткое описание обязательны');
                return;
            }

            try {
                const allPhotos = [
                    ...(state.data.stories.find(s => s.id === state.editingId)?.photos || []),
                    ...tempPhotos
                ];

                const newStory = {
                    id: state.editingId || uuid(),
                    title,
                    description: desc,
                    text,
                    photos: allPhotos,
                    preview: allPhotos[0] || ''
                };

                let stories = state.data.stories || [];
                const existingIndex = stories.findIndex(s => s.id === newStory.id);
                if (existingIndex >= 0) {
                    stories[existingIndex] = newStory;
                } else {
                    stories.unshift(newStory); // новые сверху
                }

                state.data = { stories };
                await GH.updateFile(CONFIG.dataFile, state.data);

                tempPhotos = [];
                route();
                alert('Сюжет сохранён!');
            } catch (e) {
                console.error(e);
                alert('Ошибка сохранения: ' + e.message);
            }
        }

        async function deleteStory(id) {
            if (!confirm('Вы уверены, что хотите удалить этот сюжет?')) return;
            try {
                state.data.stories = (state.data.stories || []).filter(s => s.id !== id);
                await GH.updateFile(CONFIG.dataFile, state.data);
                route();
                alert('Сюжет удалён');
            } catch (e) {
                console.error(e);
                alert('Ошибка удаления: ' + e.message);
            }
        }

        function checkAdminPassword() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === CONFIG.adminPassword) {
                state.user.isAdmin = true;
                renderAdminBadge();
                route(); // вернуться к списку
            } else {
                document.getElementById('login-error').textContent = 'Неверный пароль';
            }
        }

        function logout() {
            state.user.isAdmin = false;
            state.user.token = '';
            localStorage.removeItem('gh_token');
            renderAdminBadge();
            route();
        }

        async function tryAutoLogin() {
            const savedToken = localStorage.getItem('gh_token');
            if (savedToken) {
                await GH.setToken(savedToken);
                try {
                    const res = await fetch('https://api.github.com/user', { headers: GH.headers() });
                    if (res.ok) {
                        state.user.isAdmin = true;
                        renderAdminBadge();
                    } else {
                        localStorage.removeItem('gh_token');
                    }
                } catch (e) {
                    console.warn('Автовход не удался', e);
                    localStorage.removeItem('gh_token');
                }
            }
        }

        function route(mode = 'list') {
            state.mode = mode;
            switch (mode) {
                case 'list':
                    renderList();
                    break;
                case 'admin-login':
                    renderLoginForm();
                    break;
                case 'admin-panel':
                    state.editingId = null;
                    renderEditForm(null);
                    break;
                default:
                    renderList();
            }
        }

        (async () => {
            await tryAutoLogin();
            try {
                state.data = await fetchRaw(CONFIG.dataFile);
            } catch (e) {
                console.warn('data.json не найден, создаём пустой', e);
                state.data = { stories: [] };
            }
            route('list');
        })();
    </script>
</body>
</html>
