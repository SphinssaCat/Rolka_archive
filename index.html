<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив Всея Ролки</title>
    <style>
        :root {
            --bg-color: #F5E6C8;
            --card-bg-top: #000000;
            --card-bg-bottom: #FFB81C;
            --text-color: #000;
            --text-muted: #333;
            --btn-color: #FFB81C;
            --font-main: 'Segoe UI', system-ui, sans-serif;
            --font-display: 'Courier New', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            color: #000;
            background: var(--bg-color);
            min-height: 100vh;
        }
        h1 {
            font-family: var(--font-display);
            text-align: center;
            color: var(--text-color);
            font-size: 3rem;
            margin: 40px 0 60px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        #app { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Сетка карточек */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }
        .card {
            background: linear-gradient(180deg, var(--card-bg-top), var(--card-bg-bottom));
            height: 160px;
            border-radius: 0;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.3s ease, filter 0.3s;
            align-items: flex-start;
        }
        .card:hover {
            transform: translateY(-5px);
            filter: brightness(1.05);
        }
        .card h3 {
            font-family: var(--font-display);
            color: var(--text-color);
            font-size: 1.3rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Кнопки навигации */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
        }
        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg-top);
            color: var(--btn-color);
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
        }
        .nav-btn:hover {
            background: var(--btn-color);
            color: var(--card-bg-top);
            transform: scale(1.05);
        }

        /* Формы и админ-панель */
        .form-box {
            background: #fff;
            border: 1px solid #000;
            padding: 30px;
            border-radius: 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        .form-box label {
            display: block;
            margin-top: 15px;
            font-family: var(--font-display);
            text-transform: uppercase;
            color: var(--card-bg-top);
            font-size: 0.85rem;
        }
        .form-box input[type="text"],
        .form-box textarea,
        .form-box input[type="password"],
        .form-box input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            font-family: inherit;
            margin-top: 5px;
        }
        .form-box textarea {
            min-height: 150px;
            resize: vertical;
        }
        .btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--card-bg-top);
            color: var(--btn-color);
            border: none;
            font-family: var(--font-display);
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--btn-color); color: var(--card-bg-top); }
        .btn-danger { background: #c9184a; }
        .btn-danger:hover { background: #ff4d6d; }

        /* Режим большого редактора */
        .fullscreen-editor {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .fullscreen-editor .form-box {
            margin: 30px auto;
            max-width: 800px;
            width: 90%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .fullscreen-editor .form-box textarea { flex: 1; }
        .fullscreen-editor .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            background: none;
            border: 1px solid #000;
            padding: 8px 16px;
            font-family: var(--font-display);
            cursor: pointer;
        }

        .back-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 50;
            background: none;
            border: 1px solid #000;
            color: #000;
            border-radius: 0;
            padding: 10px 20px;
            font-family: var(--font-display);
            cursor: pointer;
        }

        /* Панель редактора тем */
        #theme-editor {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .theme-panel {
            background: #fff;
            padding: 30px;
            border: 1px solid #000;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .theme-panel label {
            font-family: var(--font-display);
            text-transform: uppercase;
            color: #000;
            font-size: 0.8rem;
        }
        .theme-panel input[type="color"] {
            border: 1px solid #000;
            padding: 5px;
            cursor: pointer;
        }
        .theme-panel .btn {
            margin-top: 0;
            width: 100%;
            text-align: center;
        }

        /* Галерея */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .gallery-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid #000;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Панель редактора тем -->
    <div id="theme-editor">
        <div class="theme-panel">
            <h2 style="font-family:var(--font-display); text-align:center;">🎨 Оформление</h2>
            <label>Фон сайта</label>
            <input type="color" id="cfg-bg-color" value="#F5E6C8">
            
            <label>Заголовок карточки</label>
            <input type="color" id="cfg-card-title" value="#000000">
            
            <label>Описание карточки</label>
            <input type="color" id="cfg-card-desc" value="#333333">
            
            <label>Градиент (верх)</label>
            <input type="color" id="cfg-card-top" value="#000000">
            
            <label>Градиент (низ)</label>
            <input type="color" id="cfg-card-bottom" value="#FFB81C">
            
            <label>Цвет кнопок</label>
            <input type="color" id="cfg-btn-color" value="#FFB81C">
            
            <button class="btn" onclick="saveThemeSettings()">Сохранить оформление</button>
            <button class="btn btn-danger" onclick="closeThemeEditor()">Закрыть</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            owner: 'SphinssaCat',
            repo: 'Rolka_archive',
            branch: 'main',
            dataFile: 'data.json',
            configFile: 'config.json',
            adminPassword: '222745547Grr'
        };

        let state = {
            mode: 'list',
            data: null,
            config: null,
            user: { isAdmin: false, token: '' },
            editingId: null
        };
        // ИСПРАВЛЕНО: инициализируем пустой массив, а не синтаксическую ошибку
        let tempPhotos = []; 

        const GH = {
            headers() {
                const token = state.user.token || localStorage.getItem('gh_token');
                return {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                };
            },
            async getToken() {
                return localStorage.getItem('gh_token');
            },
            async uploadImage(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            // ИСПРАВЛЕНО: берем часть после запятой и используем её как base64
                            const base64Data = e.target.result.split(',')[1];
                            const path = `images/${Date.now()}_${file.name}`;
                            const payload = {
                                message: 'Upload image',
                                content: base64Data,
                                branch: CONFIG.branch
                            };
                            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, {
                                method: 'PUT',
                                headers: this.headers(),
                                body: JSON.stringify(payload)
                            });
                            if (!res.ok) throw new Error('Upload failed');
                            const rawUrl = (p) => `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${p}`;
                            resolve(rawUrl(path));
                        } catch (e) { 
                            console.error(e);
                            reject(e); 
                        }
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            },
            async updateFile(path, content) {
                // Сначала получаем текущую версию файла, чтобы получить SHA
                const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, { headers: this.headers() });
                if (!res.ok && res.status !== 404) throw new Error('Cannot get file info');
                const info = res.status === 404 ? null : await res.json();

                const payload = {
                    message: 'Update file',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                    branch: CONFIG.branch
                };
                if (info) payload.sha = info.sha;

                const putRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: this.headers(),
                    body: JSON.stringify(payload)
                });
                if (!putRes.ok) {
                    const err = await putRes.json();
                    throw new Error(err.message || 'Update failed');
                }
                return true;
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatDescription(text) {
            if (!text) return '';
            return text.replace(/\n/g, '<br>');
        }

        function renderGallery(images) {
            if (!images || images.length === 0) return '';
            const html = images.map(img => `<img src="${img}" alt="" class="gallery-img">`).join('');
            return `<div class="gallery-grid">${html}</div>`;
        }

        function renderAdminBadge() {
            const container = document.getElementById('admin-btn-container') || document.createElement('div');
            container.id = 'admin-btn-container';
            container.style.position = 'fixed';
            container.style.top = '20px';
            container.style.right = '20px';
            container.style.zIndex = '60';
            container.style.textAlign = 'right';

            if (state.user.isAdmin) {
                container.innerHTML = `
                    <div style="display:flex; gap:10px; align-items:center;">
                        <span style="font-family:var(--font-display); color:var(--text-color); text-transform:uppercase;">👑 Админ</span>
                        <button onclick="openThemeEditor()" class="btn" style="padding:5px 15px; font-size:0.8rem;">🎨 Оформление                        <button onclick="openThemeEditor()" class="btn" style="padding:5px 15px; font-size:0.8rem;">🎨 Оформление</button>
                        <button onclick="logout()" class="btn btn-danger" style="padding:5px 15px; font-size:0.8rem;">Выйти</button>
                    </div>
                `;
            } else {
                container.innerHTML = `<button class="btn" onclick="route('admin-login')" style="padding:5px 15px; font-size:0.8rem;">Войти как админ</button>`;
            }
            document.body.appendChild(container);
        }

        function renderList() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            app.innerHTML += `<h1>Архив Всея Ролки</h1>`;

            if (!state.data || !state.data.stories || state.data.stories.length === 0) {
                app.innerHTML += '<div class="empty-state">Нет сюжетов. Проверьте наличие data.json в репозитории.</div>';
            } else {
                const grid = document.createElement('div');
                grid.className = 'cards-grid';
                grid.innerHTML = state.data.stories.map(s => `
                    <div class="card" onclick="route('story', {id:'${s.id}'})">
                        <h3>${escapeHtml(s.title)}</h3>
                        <p>${escapeHtml(s.description)}</p>
                    </div>
                `).join('');
                app.appendChild(grid);
            }

            const btnContainer = document.createElement('div');
            btnContainer.style.marginTop = '40px';
            btnContainer.style.textAlign = 'center';

            if (state.user.isAdmin) {
                btnContainer.innerHTML = `
                    <button class="btn btn-save" onclick="openEditForm()">
                        + Добавить сюжет
                    </button>
                `;
            } else {
                btnContainer.innerHTML = `
                    <p style="font-family:var(--font-display); color:#888; margin-bottom:15px;">
                        Для добавления сюжетов требуется доступ администратора.
                    </p>
                    <button class="btn" onclick="route('admin-login')">
                        Войти как админ
                    </button>
                `;
            }
            app.appendChild(btnContainer);
        }

        function renderStoryPage(id) {
            const story = (state.data?.stories || []).find(s => s.id === id);
            if (!story) return route('list');

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route('list')">← Назад</button>
                <h1>${escapeHtml(story.title)}</h1>
                <p><strong>Описание:</strong> ${escapeHtml(story.description)}</p>
                <div>${formatDescription(story.text)}</div>

                <div style="margin-top:30px; display:flex; gap:15px;">
                    <button class="btn" onclick="route('story-gallery', {id:'${id}'})">🖼 Галерея</button>
                    <button class="btn" onclick="route('story-characters', {id:'${id}'})">👤 Персонажи</button>
                </div>

                ${renderGallery(story.gallery || [])}
            `;
        }

        function renderStoryGallery(id) {
            const story = (state.data?.stories || []).find(s => s.id === id);
            if (!story) return route('list');

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route('story', {id:'${id}'})">← Назад к сюжету</button>
                <h1>${escapeHtml(story.title)} — Галерея</h1>
                ${renderGallery(story.gallery || [])}
            `;
        }

        function renderStoryCharactersList(storyId) {
            const story = (state.data?.stories || []).find(s => s.id === storyId);
            if (!story) return route('list');

            const chars = (state.data?.characters || []).filter(c => story.characters && story.characters.includes(c.id));

            const cards = chars.length
                ? chars.map(c => `
                    <div class="card" onclick="route('character', {id:'${c.id}'})">
                        <h3>${escapeHtml(c.name)}</h3>
                        <p>${escapeHtml(c.shortBio || '')}</p>
                    </div>
                  `).join('')
                : '<p>Персонажей нет.</p>';

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route('story', {id:'${storyId}'})">← Назад к сюжету</button>
                <h1>${escapeHtml(story.title)} — Персонажи</h1>
                <div class="cards-grid">${cards}</div>
            `;
        }

        function renderCharacterPage(id) {
            const char = (state.data?.characters || []).find(c => c.id === id);
            if (!char) return route('list');

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="history.back()">← Назад</button>
                <h1>${escapeHtml(char.name)}</h1>
                <p><strong>Биография:</strong></p>
                <div>${formatDescription(char.bio)}</div>
                <h2>Галерея персонажа</h2>
                ${renderGallery(char.gallery || [])}
            `;
        }

        function renderLoginForm() {
            document.getElementById('app').innerHTML = `
                <h1 style="font-family:var(--font-display);color:var(--text-color);text-transform:uppercase;">Вход админа</h1>
                <div class="form-box">
                    <label>Пароль админа</label>
                    <input type="password" id="admin-pass" placeholder="Пароль из CONFIG">
                    <button class="btn" onclick="checkAdminPassword()">Войти</button>
                    <div id="login-error" style="color:#c9184a;margin-top:15px;text-align:center;"></div>
                </div>
            `;
        }

        function checkAdminPassword() {
            const passInput = document.getElementById('admin-pass');
            const errorDiv = document.getElementById('login-error');
            
            if (passInput.value === CONFIG.adminPassword) {
                state.user.isAdmin = true;
                renderAdminBadge();
                route('list');
            } else {
                errorDiv.textContent = 'Неверный пароль';
            }
        }

        function logout() {
            state.user.isAdmin = false;
            state.user.token = '';
            localStorage.removeItem('gh_token');
            renderAdminBadge();
            route('list');
        }

        function openEditForm(story = null) {
            if (!state.user.isAdmin) {
                alert('Ошибка: вы не авторизованы как администратор. Сначала войдите.');
                route('admin-login');
                return;
            }
            
            const app = document.getElementById('app');
            app.innerHTML = `
                <button class="back-btn" onclick="route('list')">← Назад</button>
                <h1 style="font-family:var(--font-display);">${story ? 'Редактировать' : 'Новый сюжет'}</h1>
                <div class="form-box">
                    <label>Название</label>
                    <input type="text" id="edit-title" value="${story ? escapeHtml(story.title) : ''}">
                    
                    <label>Описание (короткое)</label>
                    <input type="text" id="edit-desc" value="${story ? escapeHtml(story.description) : ''}">
                    
                    <label>Текст сюжета</label>
                    <textarea id="edit-text">${story ? escapeHtml(story.text) : ''}</textarea>
                    
                    <label>Галерея (URL картинок через запятую)</label>
                    <input type="text" id="edit-gallery" value="${story && story.gallery ? story.gallery.join(',') : ''}" placeholder="https://..., https://...">
                    
                    <label>Персонажи (ID персонажей через запятую)</label>
                    <input type="text" id="edit-chars" value="${story && story.characters ? story.characters.join(',') : ''}" placeholder="1, 2, 3">
                    
                    <button class="btn" onclick="saveStory('${story ? story.id : ''}')">Сохранить</button>
                    ${story ? `<button class="btn btn-danger" onclick="deleteStory('${story.id}')">Удалить</button>` : ''}
                </div>
            `;
        }

        async function saveStory(id) {
            const title = document.getElementById('edit-title').value;
            const desc = document.getElementById('edit-desc').value;
            const text = document.getElementById('edit-text').value;
            const galleryInput = document.getElementById('edit-gallery').value;
            const charsInput = document.getElementById('edit-chars').value;

            if (!title) return alert('Введите название');

            const gallery = galleryInput ? galleryInput.split(',').map(c => c.trim()).filter(Boolean) : [];
            const characters = charsInput ? charsInput.split(',').map(c => c.trim()).filter(Boolean) : [];

            const newStory = {
                id: id || Date.now().toString(),
                title,
                description: desc,
                text,
                gallery,
                characters
            };

            if (id) {
                // Обновление
                const index = state.data.stories.findIndex(s => s.id === id);
                if (index !== -1) state.data.stories[index] = newStory;
            } else {
                // Создание
                state.data.stories.push(newStory);
            }

            try {
                await GH.updateFile(CONFIG.dataFile, state.data);
                alert('Сохранено!');
                route('list');
            } catch (e) {
                console.error(e);
                alert('Ошибка сохранения: ' + e.message);
            }
        }

        async function deleteStory(id) {
            if(!confirm('Удалить сюжет?')) return;
            state.data.stories = state.data.stories.filter(s => s.id !== id);
            try {
                await GH.updateFile(CONFIG.dataFile, state.data);
                route('list');
            } catch (e) {
                alert('Ошибка удаления: ' + e.message);
            }
        }

        function openThemeEditor() {
            document.getElementById('theme-editor').style.display = 'flex';
            // Загрузка текущих значений
            document.getElementById('cfg-bg-color').value = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
            document.getElementById('cfg-card-top').value = getComputedStyle(document.documentElement).getPropertyValue('--card-bg-top').trim();
            document.getElementById('cfg-card-bottom').value = getComputedStyle(document.documentElement).getPropertyValue('--card-bg-bottom').trim();
            document.getElementById('cfg-btn-color').value = getComputedStyle(document.documentElement).getPropertyValue('--btn-color').trim();
        }

        function closeThemeEditor() {
            document.getElementById('theme-editor').style.display = 'none';
        }

        function saveThemeSettings() {
            const bg = document.getElementById('cfg-bg-color').value;
            const top = document.getElementById('cfg-card-top').value;
            const bottom = document.getElementById('cfg-card-bottom').value;
            const btn = document.getElementById('cfg-btn-color').value;

            document.documentElement.style.setProperty('--bg-color', bg);
            document.documentElement.style.setProperty('--card-bg-top', top);
            document.documentElement.style.setProperty('--card-bg-bottom', bottom);
            document.documentElement.style.setProperty('--btn-color', btn);
            
            localStorage.setItem('theme-bg', bg);
            localStorage.setItem('theme-top', top);
            localStorage.setItem('theme-bottom', bottom);
            localStorage.setItem('theme-btn', btn);
            
            closeThemeEditor();
        }

        function route(mode, params = {}) {
            state.mode = mode;
            switch(mode) {
                case 'list': renderList(); break;
                case 'story': renderStoryPage(params.id); break;
                case 'story-gallery': renderStoryGallery(params.id); break;
                case 'story-characters': renderStoryCharactersList(params.id); break;
                case 'character': renderCharacterPage(params.id); break;
                case 'admin-login': renderLoginForm(); break;
                default: renderList();
            }
        }

        async function init() {
            console.log('Загрузка данных...');
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.dataFile}`);
                if (!res.ok) throw new Error('Файл data.json не найден или нет доступа. Проверьте репозиторий и токен.');
                state.data = await res.json();
                console.log('Данные загружены:', state.data);
                route('list');
            } catch (e) {
                console.error(e);
                document.getElementById('app').innerHTML = `
                    <h1>Ошибка загрузки</h1>
                    <div class="empty-state">
                        <p>${e.message}</p>
                        <p>Убедитесь, что:</p>
                        <ul style="text-align:left; margin-top:10px; padding-left:20px;">
                            <li>Репозиторий существует.</li>
                            <li>Файл data.json лежит в корне.</li>
                            <li>В консоли браузера введен токен: localStorage.setItem('gh_token', 'ВАШ_ТОКЕН')</li>
                        </ul>
                    </div>
                `;
            }
        }

        // Проверка сохраненной темы
        const savedBg = localStorage.getItem('theme-bg');
        if(savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg-top', localStorage.getItem('theme-top') || '#000000');
            document.documentElement.style.setProperty('--card-bg-bottom', localStorage.getItem('theme-bottom') || '#FFB81C');
            document.documentElement.style.setProperty('--btn-color', localStorage.getItem('theme-btn') || '#FFB81C');
        }

        // Запуск
        init();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

</body>
</html>
