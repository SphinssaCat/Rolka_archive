<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив Всея Ролки</title>
    <style>
        :root {
            --bg-color: #F5E6C8;
            --card-bg-top: #000000;
            --card-bg-bottom: #FFB81C;
            --text-color: #000;
            --text-muted: #333;
            --btn-color: #FFB81C;
            --font-main: 'Segoe UI', system-ui, sans-serif;
            --font-display: 'Courier New', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            color: #000;
            background: var(--bg-color);
            min-height: 100vh;
        }
        h1 {
            font-family: var(--font-display);
            text-align: center;
            color: var(--text-color);
            font-size: 3rem;
            margin: 40px 0 60px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        #app { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Сетка карточек - теперь горизонтальные прямоугольники */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }
        .card {
            background: linear-gradient(180deg, var(--card-bg-top), var(--card-bg-bottom));
            height: 160px; /* Пониженная высота */
            border-radius: 0;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.3s ease, filter 0.3s;
            align-items: flex-start;
        }
        .card:hover {
            transform: translateY(-5px);
            filter: brightness(1.05);
        }
        .card h3 {
            font-family: var(--font-display);
            color: var(--text-color);
            font-size: 1.3rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Кнопки навигации */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
        }
        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg-top);
            color: var(--btn-color);
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
        }
        .nav-btn:hover {
            background: var(--btn-color);
            color: var(--card-bg-top);
            transform: scale(1.05);
        }

        /* Формы и админ-панель */
        .form-box {
            background: #fff;
            border: 1px solid #000;
            padding: 30px;
            border-radius: 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        .form-box label {
            display: block;
            margin-top: 15px;
            font-family: var(--font-display);
            text-transform: uppercase;
            color: var(--card-bg-top);
            font-size: 0.85rem;
        }
        .form-box input[type="text"],
        .form-box textarea,
        .form-box input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            font-family: inherit;
            margin-top: 5px;
        }
        .form-box textarea {
            min-height: 150px;
            resize: vertical;
        }
        .btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--card-bg-top);
            color: var(--btn-color);
            border: none;
            font-family: var(--font-display);
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--btn-color); color: var(--card-bg-top); }
        .btn-danger { background: #c9184a; }
        .btn-danger:hover { background: #ff4d6d; }

        /* Режим большого редактора */
        .fullscreen-editor {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .fullscreen-editor .form-box {
            margin: 30px auto;
            max-width: 800px;
            width: 90%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .fullscreen-editor .form-box textarea { flex: 1; }
        .fullscreen-editor .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            background: none;
            border: 1px solid #000;
            padding: 8px 16px;
            font-family: var(--font-display);
            cursor: pointer;
        }

        .back-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 50;
            background: none;
            border: 1px solid #000;
            color: #000;
            border-radius: 0;
            padding: 10px 20px;
            font-family: var(--font-display);
            cursor: pointer;
        }

        /* Панель редактора тем */
        #theme-editor {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .theme-panel {
            background: #fff;
            padding: 30px;
            border: 1px solid #000;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .theme-panel label {
            font-family: var(--font-display);
            text-transform: uppercase;
            color: #000;
            font-size: 0.8rem;
        }
        .theme-panel input[type="color"] {
            border: 1px solid #000;
            padding: 5px;
            cursor: pointer;
        }
        .theme-panel .btn {
            margin-top: 0;
            width: 100%;
            text-align: center;
        }

        /* Галерея */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .gallery-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Панель редактора тем -->
    <div id="theme-editor">
        <div class="theme-panel">
            <h2 style="font-family:var(--font-display); text-align:center;">🎨 Оформление</h2>
            <label>Фон сайта</label>
            <input type="color" id="cfg-bg-color" value="#F5E6C8">
            
            <label>Заголовок карточки</label>
            <input type="color" id="cfg-card-title" value="#000000">
            
            <label>Описание карточки</label>
            <input type="color" id="cfg-card-desc" value="#333333">
            
            <label>Градиент (верх)</label>
            <input type="color" id="cfg-card-top" value="#000000">
            
            <label>Градиент (низ)</label>
            <input type="color" id="cfg-card-bottom" value="#FFB81C">
            
            <label>Цвет кнопок</label>
            <input type="color" id="cfg-btn-color" value="#FFB81C">
            
            <button class="btn" onclick="saveThemeSettings()">Сохранить оформление</button>
            <button class="btn btn-danger" onclick="closeThemeEditor()">Закрыть</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            owner: 'SphinssaCat',
            repo: 'Rolka_archive',
            branch: 'main',
            dataFile: 'data.json',
            configFile: 'config.json',
            adminPassword: '222745547Grr'
        };

        let state = {
            mode: 'list',
            data: null,
            config: null,
            user: { isAdmin: false, token: '' },
            editingId: null
        };
        let tempPhotos = ;

        const GH = {
            headers() {
                const token = state.user.token || localStorage.getItem('gh_token');
                return {
                    'Authorization': `token \${token}`,
                    'Content-Type': 'application/json'
                };
            },
            async getToken() {
                return localStorage.getItem('gh_token');
            },
            async uploadImage(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const content = btoa(e.target.result.split(',')); [1](https://tproger.ru/articles/kak-nastroit-autentifikaciyu-v-veb-prilozheniyah-na-django)
                            const path = `images/${Date.now()}_${file.name}`;
                            const payload = {
                                message: 'Upload image',
                                content: content,
                                branch: CONFIG.branch
                            };
                            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/\${path}`, {
                                method: 'PUT',
                                headers: this.headers(),
                                body: JSON.stringify(payload)
                            });
                            if (!res.ok) throw new Error('Upload failed');
                            const rawUrl = (path) => `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`;
                            resolve(rawUrl(path));
                        } catch (e) { reject(e); }
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            },
            async updateFile(path, content) {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/\${path}`, { headers: this.headers() });
                if (!res.ok && res.status !== 404) throw new Error('Cannot get file info');
                const info = res.status === 404 ? null : await res.json();

                const payload = {
                    message: 'Update file',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                    branch: CONFIG.branch
                };
                if (info) payload.sha = info.sha;

                const putRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/\${path}`, {
                    method: 'PUT',
                    headers: this.headers(),
                    body: JSON.stringify(payload)
                });
                if (!putRes.ok) {
                    const err = await putRes.json();
                    throw new Error(err.message || 'Update failed');
                }
                return true;
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatDescription(text) {
            if (!text) return '';
            return text.replace(/\n/g, '<br>');
        }

        function renderGallery(images) {
            if (!images || images.length === 0) return '';
            const html = images.map(img => `<img src="\${img}" alt="" class="gallery-img">`).join('');
            return `<div class="gallery-grid">\${html}</div>`;
        }

        function renderAdminBadge() {
            const container = document.getElementById('admin-btn-container') || document.createElement('div');
            container.id = 'admin-btn-container';
            container.style.position = 'fixed';
            container.style.top = '20px';
            container.style.right = '20px';
            container.style.zIndex = '60';
            container.style.textAlign = 'right';

            if (state.user.isAdmin) {
                container.innerHTML = `
                    <div style="display:flex; gap:10px; align-items:center;">
                        <span style="font-family:var(--font-display); color:var(--text-color); text-transform:uppercase;">👑 Админ</span>
                        <button onclick="openThemeEditor()" class="btn" style="padding:5px 15px; font-size:0.8rem;">🎨 Оформление</button>
                        <button onclick="logout()" class="btn btn-danger" style="padding:5px 15px; font-size:0.8rem;">Выйти</button>
                    </div>
                `;
            } else {
                container.innerHTML = `<button class="btn" onclick="route('admin-login')" style="padding:5px 15px; font-size:0.8rem;">Войти как админ</button>`;
            }
            document.body.appendChild(container);
        }

        function renderList() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            app.innerHTML += `<h1>Архив Всея Ролки</h1>`;

            if (!state.data || !state.data.stories || state.data.stories.length === 0) {
                app.innerHTML += '<div class="empty-state">Нет сюжетов</div>';
            } else {
                const grid = document.createElement('div');
                grid.className = 'cards-grid';
                grid.innerHTML = state.data.stories.map(s => `
                    <div class="card" onclick="route('story', {id:'\${s.id}'})">
                        <h3>\${escapeHtml(s.title)}</h3>
                        <p>\${escapeHtml(s.description)}</p>
                    </div>
                `).join('');
                app.appendChild(grid);
            }

            const btnContainer = document.createElement('div');
            btnContainer.style.marginTop = '40px';
            btnContainer.style.textAlign = 'center';

            if (state.user.isAdmin) {
                btnContainer.innerHTML = `
                    <button class="btn btn-save" onclick="openEditForm()">
                        + Добавить сюжет
                    </button>
                `;
            } else {
                btnContainer.innerHTML = `
                    <p style="font-family:var(--font-display); color:#888; margin-bottom:15px;">
                        Для добавления сюжетов требуется доступ администратора.
                    </p>
                    <button class="btn" onclick="route('admin-login')">
                        Войти как админ
                    </button>
                `;
            }
            app.appendChild(btnContainer);
        }

        function renderStoryPage(id) {
            const story = (state.data?.stories || ).find(s => s.id === id);
            if (!story) return route('list');

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route('list')">← Назад</button>
                <h1>\${escapeHtml(story.title)}</h1>
                <p><strong>Описание:</strong> \${escapeHtml(story.description)}</p>
                <div>\${formatDescription(story.text)}</div>

                <div style="margin-top:30px; display:flex; gap:15px;">
                    <button class="btn" onclick="route('story-gallery', {id:'\${id}'})">🖼 Галерея</button>
                    <button class="btn" onclick="route('story-characters', {id:'\${id}'})">👤 Персонажи</button>
                </div>

                \${renderGallery(story.gallery || )}
            `;
        }

        function renderStoryGallery(id) {
            const story = (state.data?.stories || ).find(s => s.id === id);
            if (!story) return route('list');

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route('story', {id:'\${id}'})">← Назад к сюжету</button>
                <h1>\${escapeHtml(story.title)} — Галерея</h1>
                \${renderGallery(story.gallery || )}
            `;
        }

        function renderStoryCharactersList(storyId) {
            const story = (state.data?.stories || ).find(s => s.id === storyId);
            if (!story) return route('list');

            const chars = (state.data?.characters || ).filter(c => story.characters && story.characters.includes(c.id));

            const cards = chars.length
                ? chars.map(c => `
                    <div class="card" onclick="route('character', {id:'\${c.id}'})">
                        <h3>\${escapeHtml(c.name)}</h3>
                        <p>\${escapeHtml(c.shortBio || '')}</p>
                    </div>
                  `).join('')
                : '<p>Персонажей нет.</p>';

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route('story', {id:'\${storyId}'})">← Назад к сюжету</button>
                <h1>\${escapeHtml(story.title)} — Персонажи</h1>
                <div class="cards-grid">\${cards}</div>
            `;
        }

        function renderCharacterPage(id) {
            const char = (state.data?.characters || ).find(c => c.id === id);
            if (!char) return route('list');

            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="history.back()">← Назад</button>
                <h1>\${escapeHtml(char.name)}</h1>
                <p><strong>Биография:</strong></p>
                <div>\${formatDescription(char.bio)}</div>
                <h2>Галерея персонажа</h2>
                \${renderGallery(char.gallery || )}
            `;
        }

        function renderLoginForm() {
            document.getElementById('app').innerHTML = `
                <h1 style="font-family:var(--font-display);color:var(--text-color);text-transform:uppercase;">Вход админа</h1>
                <div class="form-box">
                    <label>Пароль админа</label>
                    <input type="password" id="admin-pass" placeholder="Пароль из CONFIG">
                    <button class="btn" onclick="checkAdminPassword()">Войти</button>
                    <div id="login-error" style="color:#c9184a;margin-top:15px;text-align:center;"></div>
                </div>
            `;
        }

        function checkAdminPassword() {
            const passInput = document.getElementById('admin-pass');
            const errorDiv = document.getElementById('login-error');
            
            if (passInput.value === CONFIG.adminPassword) {
                state.user.isAdmin = true;
                renderAdminBadge();
                route('list');
            } else {
                errorDiv.textContent = 'Неверный пароль';
            }
        }

        function logout() {
            state.user.isAdmin = false;
            state.user.token = '';
            localStorage.removeItem('gh_token');
            renderAdminBadge();
            route('list');
        }

        function openEditForm(story = null) {
            if (!state.user.isAdmin) {
                alert('Ошибка: вы не авторизованы как администратор. Сначала войдите.');
                route('admin-login');
                return;
            }
            
            tempPhotos = ;
            renderEditForm(story);
        }

        function renderEditForm(story) {
            const app = document.getElementById('app');
            const isEdit = !!story;
            
            app.innerHTML = `
                <button class="back-btn" onclick="route()">← Назад</button>
                <h1 style="font-family:var(--font-display);color:var(--text-color);text-transform:uppercase;">
                    \${isEdit ? 'Редактировать сюжет' : 'Новый сюжет'}
                </h1>
                <div class="form-box">
                    <label>Название</label>
                    <input type="text" id="story-title" value="\${story ? escapeHtml(story.title) : ''}">
                    
                    <label>Краткое описание (для карточки)</label>
                    <input type="text" id="story-desc" value="\${story ? escapeHtml(story.description) : ''}">
                    
                    <label>Текст сюжета</label>
                    <textarea id="story-text">\${story ? escapeHtml(story.text) : ''}</textarea>

                    <label>Персонажи (ID через запятую, например: c1,c2)</label>
                    <input type="text" id="story-characters" value="\${story && story.characters ? story.characters.join(',') : ''}">
                    
                    <label>Фотографии (перетащите файлы сюда или выберите)</label>
                    <input type="file" id="story-photos" multiple accept="image/*" style="margin-top:10px;">
                    <div id="photo-preview" style="margin-top:10px; font-size:0.8rem; color:#666;"></div>
                    
                    <button class="btn" onclick="saveStory('\${story ? story.id : ''}')">
                        \${isEdit ? 'Сохранить изменения' : 'Опубликовать сюжет'}
                    </button>
                    ${isEdit ? `<button class="btn btn-danger" onclick="deleteStory('${story.id}')" style="margin-left:10px;">Удалить</button>` : ''}
                </div>
            `;

            document.getElementById('story-photos').addEventListener('change', async (e) => {
                const files = e.target.files;
                const preview = document.getElementById('photo-preview');
                preview.innerHTML = '<p>Загрузка...</p>';
                
                try {
                    for (let i = 0; i < files.length; i++) {
                        const url = await GH.uploadImage(files[i]);
                        tempPhotos.push(url);
                    }
                    preview.innerHTML = `<p>Загружено фото: \${tempPhotos.length}</p>`;
                    e.target.value = '';
                } catch (err) {
                    console.error(err);
                    preview.innerHTML = '<p style="color:red">Ошибка загрузки фото</p>';
                }
            });
        }

        async function saveStory(id) {
            const title = document.getElementById('story-title').value.trim();
            const desc = document.getElementById('story-desc').value.trim();
            const text = document.getElementById('story-text').value.trim();
            const charsInput = document.getElementById('story-characters').value.trim();
            
            if (!title) { alert('Название обязательно'); return; }

            const characters = charsInput ? charsInput.split(',').map(c => c.trim()) : ;

            const newStory = {
                id: id || uuid(),
                title: title,
                description: desc,
                text: text,
                characters: characters,
                gallery: tempPhotos
            };

            let stories = state.data.stories || ;
            if (id) {
                const index = stories.findIndex(s => s.id === id);
                if (index !== -1) stories[index] = newStory;
            } else {
                stories.push(newStory);
            }

            const newData = { stories: stories, characters: state.data.characters ||  };
            
            try {
                await GH.updateFile(CONFIG.dataFile, newData);
                alert('Сюжет успешно сохранен!');
                route('list');
            } catch (e) {
                alert('Ошибка сохранения: ' + e.message + '\nУбедитесь, что у вас есть права на запись в репозиторий и верный токен.');
                console.error(e);
            }
        }

        async function deleteStory(id) {
            if (!confirm('Вы уверены, что хотите удалить этот сюжет?')) return;
            
            let stories = state.data.stories || ;
            stories = stories.filter(s => s.id !== id);
            const newData = { stories: stories, characters: state.data.characters ||  };

            try {
                await GH.updateFile(CONFIG.dataFile, newData);
                alert('Сюжет удален');
                route('list');
            } catch (e) {
                alert('Ошибка удаления: ' + e.message);
                console.error(e);
            }
        }

        // --- Редактор оформления ---
        function openThemeEditor() {
            if (!state.user.isAdmin) return;
            const panel = document.getElementById('theme-editor');
            panel.style.display = 'flex';
            loadCurrentTheme();
        }

        function closeThemeEditor() {
            document.getElementById('theme-editor').style.display = 'none';
        }

        function loadCurrentTheme() {
            const cfg = state.config || {
                bgColor: '#F5E6C8',
                cardTitle: '#000',
                cardDesc: '#333',
                cardTop: '#000000',
                cardBottom: '#FFB81C',
                btnColor: '#FFB81C'
            };

            document.getElementById('cfg-bg-color').value = cfg.bgColor;
            document.getElementById('cfg-card-title').value = cfg.cardTitle;
            document.getElementById('cfg-card-desc').value = cfg.cardDesc;
            document.getElementById('cfg-card-top').value = cfg.cardTop;
            document.getElementById('cfg-card-bottom').value = cfg.cardBottom;
            document.getElementById('cfg-btn-color').value = cfg.btnColor;
        }

        async function saveThemeSettings() {
            const newConfig = {
                bgColor: document.getElementById('cfg-bg-color').value,
                cardTitle: document.getElementById('cfg-card-title').value,
                cardDesc: document.getElementById('cfg-card-desc').value,
                cardTop: document.getElementById('cfg-card-top').value,
                cardBottom: document.getElementById('cfg-card-bottom').value,
                btnColor: document.getElementById('cfg-btn-color').value
            };

            try {
                await GH.updateFile(CONFIG.configFile, newConfig);
                alert('Оформление сохранено! Перезагрузите страницу, чтобы увидеть изменения.');
                closeThemeEditor();
                location.reload();
            } catch (e) {
                alert('Ошибка сохранения: ' + e.message);
                console.error(e);
            }
        }

        function route(mode, params = {}) {
            if (mode === 'list') {
                renderList();
            } else if (mode === 'story') {
                renderStoryPage(params.id);
            } else if (mode === 'story-gallery') {
                renderStoryGallery(params.id);
            } else if (mode === 'story-characters') {
                renderStoryCharactersList(params.id);
            } else if (mode === 'character') {
                renderCharacterPage(params.id);
            } else if (mode === 'admin-login') {
                renderLoginForm();
            }
            renderAdminBadge();
        }

        function uuid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        async function fetchRaw(path) {
            const res = await fetch(`https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`);
            if (!res.ok) throw new Error('File not found');
            return await res.json();
        }

        // Инициализация
        (async () => {
            const savedToken = await GH.getToken();
            if (savedToken) {
                state.user.token = savedToken;
            }

            // Загрузка config.json
            try {
                state.config = await fetchRaw(CONFIG.configFile);
            } catch (e) {
                console.warn('config.json не найден, используем настройки по умолчанию');

            // Применение цветов
            const root = document.documentElement;
            root.style.setProperty('--bg-color', state.config.bgColor);
            root.style.setProperty('--card-bg-top', state.config.cardTop);
            root.style.setProperty('--card-bg-bottom', state.config.cardBottom);
            root.style.setProperty('--text-color', state.config.cardTitle);
            root.style.setProperty('--text-muted', state.config.cardDesc);
            root.style.setProperty('--btn-color', state.config.btnColor);

            // Загрузка data.json
            try {
