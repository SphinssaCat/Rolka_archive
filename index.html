<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив Всея Ролки</title>
    <style>
        :root {
            --bg-color: #F5E6C8;
            --card-bg-top: #000000;
            --card-bg-bottom: #FFB81C;
            --text-color: #000;       /* Чёрный для заголовка карточки */
            --text-muted: #333;      /* Тёмно-серый для описания */
            --btn-color: #FFB81C;
            --font-main: 'Segoe UI', system-ui, sans-serif;
            --font-display: 'Courier New', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            color: #000;
            background: var(--bg-color);
            min-height: 100vh;
        }
        h1 {
            font-family: var(--font-display);
            text-align: center;
            color: var(--text-color);
            font-size: 3rem;
            margin: 40px 0 60px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        #app { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Сетка карточек */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        .card {
            background: linear-gradient(180deg, var(--card-bg-top), var(--card-bg-bottom));
            height: 400px;
            border-radius: 0;
            padding: 30px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.3s ease, filter 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
            filter: brightness(1.1);
        }
        .card h3 {
            font-family: var(--font-display);
            color: var(--text-color); /* Чёрный */
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .card p {
            color: var(--text-muted); /* Тёмно-серый */
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Кнопки навигации */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
        }
        .nav-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--card-bg-top);
            color: var(--btn-color);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
        }
        .nav-btn:hover {
            background: var(--btn-color);
            color: var(--card-bg-top);
            transform: scale(1.1);
        }

        /* Формы и админ-панель */
        .form-box {
            background: #fff;
            border: 1px solid #000;
            padding: 40px;
            border-radius: 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        .form-box label {
            display: block;
            margin-top: 20px;
            font-family: var(--font-display);
            text-transform: uppercase;
            color: var(--card-bg-top);
            font-size: 0.9rem;
        }
        .form-box input[type="text"],
        .form-box textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            font-family: inherit;
            margin-top: 5px;
        }
        .form-box textarea {
            min-height: 200px;
            resize: vertical;
        }
        .btn {
            margin-top: 25px;
            padding: 15px 40px;
            background: var(--card-bg-top);
            color: var(--btn-color);
            border: none;
            font-family: var(--font-display);
            text-transform: uppercase;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--btn-color); color: var(--card-bg-top); }
        .btn-danger { background: #c9184a; }
        .btn-danger:hover { background: #ff4d6d; }

        /* Режим большого редактора */
        .fullscreen-editor {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .fullscreen-editor .form-box {
            margin: 40px auto;
            max-width: 800px;
            width: 90%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .fullscreen-editor .form-box textarea { flex: 1; }
        .fullscreen-editor .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            background: none;
            border: 1px solid #000;
            padding: 10px 20px;
            font-family: var(--font-display);
            cursor: pointer;
        }

        .back-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 50;
            background: none;
            border: 1px solid #000;
            color: #000;
            border-radius: 0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: var(--font-display);
            text-transform: uppercase;
        }
        .admin-badge {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 50;
            background: #000;
            color: var(--btn-color);
            border: 1px solid #000;
            padding: 8px 16px;
            font-family: var(--font-display);
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #888;
            font-family: var(--font-display);
        }
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .image-gallery img {
            width: 100%;
            border-radius: 0;
            border: 1px solid #000;
        }

        /* Панель редактора оформления */
        .theme-editor-panel {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 200;
            background: rgba(0,0,0,0.85);
            display: none;
            padding: 40px;
            color: #fff;
        }
        .theme-editor-content {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border: 1px solid #000;
            color: #000;
        }
        .theme-editor-row {
            margin-bottom: 20px;
        }
        .theme-editor-label {
            display: block;
            font-family: var(--font-display);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .color-input {
            width: 100%;
            height: 48px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .close-editor-btn {
            background: none;
            border: 1px solid #000;
            padding: 12px 24px;
            cursor: pointer;
            font-family: var(--font-display);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="admin-btn-container"></div>
    <div id="app"></div>

    <!-- Панель редактора оформления -->
    <div id="theme-editor" class="theme-editor-panel">
        <div class="theme-editor-content">
            <h2 style="font-family:var(--font-display);text-transform:uppercase;margin-bottom:20px;">Настройка оформления</h2>

            <div class="theme-editor-row">
                <label class="theme-editor-label">Фон страницы</label>
                <input type="color" id="cfg-bg-color" class="color-input">
            </div>
            <div class="theme-editor-row">
                <label class="theme-editor-label">Цвет заголовка карточки</label>
                <input type="color" id="cfg-card-title" class="color-input">
            </div>
            <div class="theme-editor-row">
                <label class="theme-editor-label">Цвет описания карточки</label>
                <input type="color" id="cfg-card-desc" class="color-input">
            </div>
            <div class="theme-editor-row">
                <label class="theme-editor-label">Градиент карточки (верх)</label>
                <input type="color" id="cfg-card-top" class="color-input">
            </div>
            <div class="theme-editor-row">
                <label class="theme-editor-label">Градиент карточки (низ)</label>
                <input type="color" id="cfg-card-bottom" class="color-input">
            </div>
            <div class="theme-editor-row">
                <label class="theme-editor-label">Цвет кнопок</label>
                <input type="color" id="cfg-btn-color" class="color-input">
            </div>

            <button class="close-editor-btn" onclick="closeThemeEditor()">Закрыть</button>
            <button class="btn" style="margin-top:15px;width:auto;" onclick="saveThemeSettings()">Сохранить оформление</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            owner: 'SphinssaCat',
            repo: 'Rolka_archive',
            branch: 'main',
            dataFile: 'data.json',
            configFile: 'config.json',
            adminPassword: '222745547Grr'
        };

        let state = { mode: 'list', data: null, config: null, user: { isAdmin: false, token: '' }, editingId: null };
        let tempPhotos = [];

        function uuid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
        function rawUrl(path) { return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`; }

        async function fetchRaw(path) {
            const res = await fetch(rawUrl(path));
            if (!res.ok) throw new Error('Not found');
            return await res.json();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatDescription(text) {
            if (!text) return '<p style="color:#888">Описание не задано.</p>';
            return text.split(/\r?\n/).filter(l => l.trim() !== '').map(l => '<p>' + escapeHtml(l) + '</p>').join('');
        }

        function renderGallery(photos) {
            if (!photos || photos.length === 0) return '';
            return '<div class="image-gallery">' + photos.map(url => `
                <img src="${escapeHtml(url)}" alt="Фото" onclick="window.open('${escapeHtml(url)}','_blank')" onerror="this.style.display='none'">
            `).join('') + '</div>';
        }

        const GH = {
            async getToken() { return localStorage.getItem('gh_token'); },
            async setToken(token) { localStorage.setItem('gh_token', token); state.user.token = token; },
            headers() {
                const token = state.user.token;
                return {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': token ? `token ${token}` : '',
                    'Content-Type': 'application/json'
                };
            },
            async uploadImage(file, folder = 'images') {
                const reader = new FileReader();
                return new Promise((resolve, reject) => {
                    reader.readAsDataURL(file);
                    reader.onload = async () => {
                        try {
                            const parts = reader.result.split(',');
                            if (parts.length < 2) throw new Error('Invalid file format');
                            const blob = parts[1];
                            const ext = file.name.split('.').pop().toLowerCase();
                            if (!['jpg','jpeg','png','gif','webp'].includes(ext)) throw new Error('Неподдерживаемый формат');
                            const path = `${folder}/${uuid()}.${ext}`;
                            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, {
                                method: 'PUT',
                                headers: this.headers(),
                                body: JSON.stringify({ message: 'Upload image', content: blob })
                            });
                            if (!res.ok) throw new Error('Upload failed');
                            resolve(rawUrl(path));
                        } catch (e) { reject(e); }
                    };
                    reader.onerror = reject;
                });
            },
            async updateFile(path, content) {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, { headers: this.headers() });
                if (!res.ok && res.status !== 404) throw new Error('Cannot get file info');
                const info = res.status === 404 ? null : await res.json();

                const payload = {
                    message: 'Update file',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                    branch: CONFIG.branch
                };
                if (info) payload.sha = info.sha;

                const putRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: this.headers(),
                    body: JSON.stringify(payload)
                });
                if (!putRes.ok) {
                    const err = await putRes.json();
                    throw new Error(err.message || 'Update failed');
                }
                return true;
            }
        };

        function renderAdminBadge() {
            const container = document.getElementById('admin-btn-container');
            if (state.user.isAdmin) {
                container.innerHTML = `
                    <div class="admin-badge">
                        👑 Админ 
                        <button onclick="openThemeEditor()" style="background:none;border:none;color:var(--btn-color);cursor:pointer;font-family:inherit;font-weight:bold;">🎨 Оформление</button>
                        <button onclick="logout()" style="background:none;border:none;color:var(--btn-color);cursor:pointer;font-family:inherit;font-weight:bold;">Выйти</button>
                    </div>
                `;
            } else {
                container.innerHTML = `<button class="back-btn" onclick="route('admin-login')">Войти как админ</button>`;
            }
        }

        function renderList() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            app.innerHTML += `<h1>Архив Всея Ролки</h1>`;

            if (!state.data || !state.data.stories || state.data.stories.length === 0) {
                app.innerHTML += '<div class="empty-state">Нет сюжетов</div>';
            } else {
                const grid = document.createElement('div');
                grid.className = 'cards-grid';
                grid.innerHTML = state.data.stories.map(s => `
                    <div class="card" onclick="openStory('${s.id}')">
                        <h3>${escapeHtml(s.title)}</h3>
                        <p>${escapeHtml(s.description)}</p>
                    </div>
                `).join('');
                app.appendChild(grid);
            }

            const btnContainer = document.createElement('div');
            btnContainer.style.marginTop = '40px';
            btnContainer.style.textAlign = 'center';

            if (state.user.isAdmin) {
                btnContainer.innerHTML = `
                    <button class="btn btn-save" onclick="openEditForm()">
                        + Добавить сюжет
                    </button>
                `;
            } else {
                btnContainer.innerHTML = `
                    <p style="font-family:var(--font-display); color:#888; margin-bottom:15px;">
                        Для добавления сюжетов требуется доступ администратора.
                    </p>
                    <button class="btn" onclick="route('admin-login')">
                        Войти как админ
                    </button>
                `;
            }
            app.appendChild(btnContainer);
        }

        function openStory(id) {
            const story = (state.data?.stories || []).find(s => s.id === id);
            if (!story) return;
            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route()">← Назад</button>
                <h1>${escapeHtml(story.title)}</h1>
                <p><strong>Описание:</strong> ${escapeHtml(story.description)}</p>
                <div>${formatDescription(story.text)}</div>
                ${renderGallery(story.photos)}
            `;
        }

        function renderLoginForm() {
            document.getElementById('app').innerHTML = `
                <h1 style="font-family:var(--font-display);color:var(--text-color);text-transform:uppercase;">Вход админа</h1>
                <div class="form-box">
                    <label>Пароль админа</label>
                    <input type="password" id="admin-pass" placeholder="Пароль из CONFIG">
                    <button class="btn" onclick="checkAdminPassword()">Войти</button>
                    <div id="login-error" style="color:#c9184a;margin-top:15px;text-align:center;"></div>
                </div>
            `;
        }

        function checkAdminPassword() {
            const passInput = document.getElementById('admin-pass');
            const errorDiv = document.getElementById('login-error');
            
            if (passInput.value === CONFIG.adminPassword) {
                state.user.isAdmin = true;
                renderAdminBadge();
                route('list');
            } else {
                errorDiv.textContent = 'Неверный пароль';
            }
        }

        function logout() {
            state.user.isAdmin = false;
            state.user.token = '';
            localStorage.removeItem('gh_token');
            renderAdminBadge();
            route('list');
        }

        function openEditForm(story = null) {
            if (!state.user.isAdmin) {
                alert('Ошибка: вы не авторизованы как администратор. Сначала войдите.');
                route('admin-login');
                return;
            }
            
            tempPhotos = [];
            renderEditForm(story);
        }

        function renderEditForm(story) {
            const app = document.getElementById('app');
            const isEdit = !!story;
            
            app.innerHTML = `
                <button class="back-btn" onclick="route()">← Назад</button>
                <h1 style="font-family:var(--font-display);color:var(--text-color);text-transform:uppercase;">
                    ${isEdit ? 'Редактировать сюжет' : 'Новый сюжет'}
                </h1>
                <div class="form-box">
                    <label>Название</label>
                    <input type="text" id="story-title" value="${story ? escapeHtml(story.title) : ''}">
                    
                    <label>Краткое описание (для карточки)</label>
                    <input type="text" id="story-desc" value="${story ? escapeHtml(story.description) : ''}">
                    
                    <label>Текст сюжета</label>
                    <textarea id="story-text">${story ? escapeHtml(story.text) : ''}</textarea>
                    
                    <label>Фотографии (перетащите файлы сюда или выберите)</label>
                    <input type="file" id="story-photos" multiple accept="image/*" style="margin-top:10px;">
                    <div id="photo-preview" style="margin-top:10px; font-size:0.8rem; color:#666;"></div>
                    
                    <button class="btn" onclick="saveStory('${story ? story.id : ''}')">
                        ${isEdit ? 'Сохранить изменения' : 'Опубликовать сюжет'}
                    </button>
                    ${isEdit ? `<button class="btn btn-danger" onclick="deleteStory('${story.id}')" style="margin-left:10px;">Удалить</button>` : ''}
                </div>
            `;

            document.getElementById('story-photos').addEventListener('change', async (e) => {
                const files = e.target.files;
                const preview = document.getElementById('photo-preview');
                preview.innerHTML = '<p>Загрузка...</p>';
                
                try {
                    for (let i = 0; i < files.length; i++) {
                        const url = await GH.uploadImage(files[i]);
                        tempPhotos.push(url);
                    }
                    preview.innerHTML = `<p>Загружено фото: ${tempPhotos.length}</p>`;
                    e.target.value = '';
                } catch (err) {
                    console.error(err);
                    preview.innerHTML = '<p style="color:red">Ошибка загрузки фото</p>';
                }
            });
        }

        async function saveStory(id) {
            const title = document.getElementById('story-title').value.trim();
            const desc = document.getElementById('story-desc').value.trim();
            const text = document.getElementById('story-text').value.trim();
            
            if (!title) { alert('Название обязательно'); return; }

            const newStory = {
                id: id || uuid(),
                title: title,
                description: desc,
                text: text,
                photos: tempPhotos
            };

            let stories = state.data.stories || [];
            if (id) {
                const index = stories.findIndex(s => s.id === id);
                if (index !== -1) stories[index] = newStory;
            } else {
                stories.push(newStory);
            }

            const newData = { stories: stories };
            
            try {
                await GH.updateFile(CONFIG.dataFile, newData);
                alert('Сюжет успешно сохранен!');
                route('list');
            } catch (e) {
                alert('Ошибка сохранения: ' + e.message + '\nУбедитесь, что у вас есть права на запись в репозиторий и верный токен.');
                console.error(e);
            }
        }

        async function deleteStory(id) {
            if (!confirm('Вы уверены, что хотите удалить этот сюжет?')) return;
            
            let stories = state.data.stories || [];
            stories = stories.filter(s => s.id !== id);
            const newData = { stories: stories };

            try {
                await GH.updateFile(CONFIG.dataFile, newData);
                alert('Сюжет удален');
                route('list');
            } catch (e) {
                alert('Ошибка удаления: ' + e.message);
                console.error(e);
            }
        }

        // --- Редактор оформления ---
        function openThemeEditor() {
            if (!state.user.isAdmin) return;
            const panel = document.getElementById('theme-editor');
            panel.style.display = 'flex';
            loadCurrentTheme();
        }

        function closeThemeEditor() {
            document.getElementById('theme-editor').style.display = 'none';
        }

        function loadCurrentTheme() {
            const cfg = state.config || {
                bgColor: '#F5E6C8',
                cardTitle: '#000',
                cardDesc: '#333',
                cardTop: '#000000',
                cardBottom: '#FFB81C',
                btnColor: '#FFB81C'
            };

            document.getElementById('cfg-bg-color').value = cfg.bgColor;
            document.getElementById('cfg-card-title').value = cfg.cardTitle;
            document.getElementById('cfg-card-desc').value = cfg.cardDesc;
            document.getElementById('cfg-card-top').value = cfg.cardTop;
            document.getElementById('cfg-card-bottom').value = cfg.cardBottom;
            document.getElementById('cfg-btn-color').value = cfg.btnColor;
        }

        async function saveThemeSettings() {
            const newConfig = {
                bgColor: document.getElementById('cfg-bg-color').value,
                cardTitle: document.getElementById('cfg-card-title').value,
                cardDesc: document.getElementById('cfg-card-desc').value,
                cardTop: document.getElementById('cfg-card-top').value,
                cardBottom: document.getElementById('cfg-card-bottom').value,
                btnColor: document.getElementById('cfg-btn-color').value
            };

            try {
                await GH.updateFile(CONFIG.configFile, newConfig);
                alert('Оформление сохранено! Перезагрузите страницу, чтобы увидеть изменения.');
                closeThemeEditor();
                location.reload();
            } catch (e) {
                alert('Ошибка сохранения: ' + e.message);
                console.error(e);
            }
        }

        function route(mode = 'list') {
            if (mode === 'list') {
                renderList();
            } else if (mode === 'admin-login') {
                renderLoginForm();
            }
            renderAdminBadge();
        }

        // Инициализация
        (async () => {
            const savedToken = await GH.getToken();
            if (savedToken) {
                state.user.token = savedToken;
            }

            // Загрузка config.json
            try {
                state.config = await fetchRaw(CONFIG.configFile);
            } catch (e) {
                console.warn('config.json не найден, используем настройки по умолчанию');
                state.config = {
                    bgColor: '#F5E6C8',
                    cardTitle: '#000',
                    cardDesc: '#333',
                    cardTop: '#000000',
                    cardBottom: '#FFB81C',
                    btnColor: '#FFB81C'
                };
            }

            // Применение цветов
            const root = document.documentElement;
            root.style.setProperty('--bg-color', state.config.bgColor);
            root.style.setProperty('--card-bg-top', state.config.cardTop);
            root.style.setProperty('--card-bg-bottom', state.config.cardBottom);
            root.style.setProperty('--text-color', state.config.cardTitle);
            root.style.setProperty('--text-muted', state.config.cardDesc);
            root.style.setProperty('--btn-color', state.config.btnColor);

            // Загрузка data.json
            try {
                state.data = await fetchRaw(CONFIG.dataFile);
            } catch (e) {
