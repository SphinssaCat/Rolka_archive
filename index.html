<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив Всея Ролки</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg-top: #000000;
            --card-bg-bottom: #FFB81C;
            --text-color: #FFB81C;
            --text-muted: #D4A373;
            --btn-color: #FFB81C;
            --btn-hover: #E5A619;
            --font-main: 'Segoe UI', system-ui, sans-serif;
            --font-display: 'Courier New', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            color: #000;
            background: var(--bg-color);
            min-height: 100vh;
        }
        h1 {
            font-family: var(--font-display);
            text-align: center;
            color: var(--text-color);
            font-size: 3rem;
            margin: 40px 0 60px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        #app { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Сетка карточек как на фото */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        .card {
            background: linear-gradient(180deg, var(--card-bg-top), var(--card-bg-bottom));
            height: 400px;
            border-radius: 0;
            padding: 30px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.3s ease, filter 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
            filter: brightness(1.1);
        }
        .card h3 {
            font-family: var(--font-display);
            color: var(--text-color);
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Кнопки-стрелки как на фото */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
        }
        .nav-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--card-bg-top);
            color: var(--btn-color);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
        }
        .nav-btn:hover {
            background: var(--btn-color);
            color: var(--card-bg-top);
            transform: scale(1.1);
        }

        /* Формы и админ-панель */
        .form-box {
            background: #fff;
            border: 1px solid #000;
            padding: 40px;
            border-radius: 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        .form-box label {
            display: block;
            margin-top: 20px;
            font-family: var(--font-display);
            text-transform: uppercase;
            color: var(--card-bg-top);
            font-size: 0.9rem;
        }
        .form-box input[type="text"],
        .form-box textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            font-family: inherit;
            margin-top: 5px;
        }
        .form-box textarea {
            min-height: 200px;
            resize: vertical;
        }
        .btn {
            margin-top: 25px;
            padding: 15px 40px;
            background: var(--card-bg-top);
            color: var(--btn-color);
            border: none;
            font-family: var(--font-display);
            text-transform: uppercase;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn:hover { background: var(--btn-color); color: var(--card-bg-top); }
        .btn-danger { background: #c9184a; }
        .btn-danger:hover { background: #ff4d6d; }

        /* Режим большого редактора */
        .fullscreen-editor {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .fullscreen-editor .form-box {
            margin: 40px auto;
            max-width: 800px;
            width: 90%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .fullscreen-editor .form-box textarea {
            flex: 1;
        }
        .fullscreen-editor .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            background: none;
            border: 1px solid #000;
            padding: 10px 20px;
            font-family: var(--font-display);
            cursor: pointer;
        }

        .back-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 50;
            background: none;
            border: 1px solid #000;
            color: #000;
            border-radius: 0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: var(--font-display);
            text-transform: uppercase;
        }
        .admin-badge {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 50;
            background: #000;
            color: var(--btn-color);
            border: 1px solid #000;
            padding: 8px 16px;
            font-family: var(--font-display);
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #888;
            font-family: var(--font-display);
        }
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .image-gallery img {
            width: 100%;
            border-radius: 0;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div id="admin-btn-container"></div>
    <div id="app"></div>

    <script>
        const CONFIG = {
            owner: 'SphinssaCat',
            repo: 'Rolka_archive',
            branch: 'main',
            dataFile: 'data.json',
            adminPassword: '222745547Grr'
        };

        let state = { mode: 'list', data: null, user: { isAdmin: false, token: '' }, editingId: null };

        function uuid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
        function rawUrl(path) { return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`; }

        async function fetchRaw(path) {
            const res = await fetch(rawUrl(path));
            if (!res.ok) throw new Error('Not found');
            return await res.json();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatDescription(text) {
            if (!text) return '<p style="color:#888">Описание не задано.</p>';
            return text.split(/\r?\n/).filter(l => l.trim() !== '').map(l => '<p>' + escapeHtml(l) + '</p>').join('');
        }

        function renderGallery(photos) {
            if (!photos || photos.length === 0) return '';
            return '<div class="image-gallery">' + photos.map(url => `
                <img src="${escapeHtml(url)}" alt="Фото" onclick="window.open('${escapeHtml(url)}','_blank')" onerror="this.style.display='none'">
            `).join('') + '</div>';
        }

        const GH = {
            async getToken() { return localStorage.getItem('gh_token'); },
            async setToken(token) { localStorage.setItem('gh_token', token); state.user.token = token; },
            headers() {
                const token = state.user.token;
                return {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': token ? `token \${token}` : '',
                    'Content-Type': 'application/json'
                };
            },
            async uploadImage(file, folder = 'images') {
                const reader = new FileReader();
                return new Promise((resolve, reject) => {
                    reader.readAsDataURL(file);
                    reader.onload = async () => {
                        try {
                            const blob = reader.result.split(',');
                            const ext = file.name.split('.').pop().toLowerCase();
                            if (!['jpg','jpeg','png','gif','webp'].includes(ext)) throw new Error('Неподдерживаемый формат');
                            const path = `${folder}/${uuid()}.\${ext}`;
                            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/\${path}`, {
                                method: 'PUT',
                                headers: this.headers(),
                                body: JSON.stringify({ message: 'Upload image', content: blob })
                            });
                            if (!res.ok) throw new Error('Upload failed');
                            const data = await res.json();
                            resolve(rawUrl(path));
                        } catch (e) { reject(e); }
                    };
                    reader.onerror = reject;
                });
            },
            async updateFile(path, content) {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/\${path}`, { headers: this.headers() });
                if (!res.ok && res.status !== 404) throw new Error('Cannot get file info');
                const info = res.status === 404 ? null : await res.json();

                const payload = {
                    message: 'Update file',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                    branch: CONFIG.branch
                };
                if (info) payload.sha = info.sha;

                const putRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/\${path}`, {
                    method: 'PUT',
                    headers: this.headers(),
                    body: JSON.stringify(payload)
                });
                if (!putRes.ok) {
                    const err = await putRes.json();
                    throw new Error(err.message || 'Update failed');
                }
                return true;
            }
        };

        function renderAdminBadge() {
            const container = document.getElementById('admin-btn-container');
            container.innerHTML = state.user.isAdmin
                ? `<div class="admin-badge">👑 Админ <button onclick="logout()" style="background:none;border:none;color:var(--btn-color);cursor:pointer;font-family:inherit;font-weight:bold;">Выйти</button></div>`
                : `<button class="back-btn" onclick="route('admin-login')">Войти как админ</button>`;
        }

        function renderList() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!state.data || !state.data.stories || state.data.stories.length === 0) {
                app.innerHTML = '<div class="empty-state">Нет сюжетов</div>';
            } else {
                app.innerHTML += `<h1>Архив Всея Ролки</h1><div class="cards-grid"></div>`;
                const grid = app.querySelector('.cards-grid');
                grid.innerHTML = state.data.stories.map(s => `
                    <div class="card" onclick="openStory('\${s.id}')">
                        <h3>\${escapeHtml(s.title)}</h3>
                        <p>\${escapeHtml(s.description)}</p>
                    </div>
                `).join('');
            }

            if (state.user.isAdmin) {
                const btnContainer = document.createElement('div');
                btnContainer.style.marginTop = '20px';
                btnContainer.style.textAlign = 'center';
                btnContainer.innerHTML = `<button class="btn btn-save" onclick="route('admin-panel')">+ Добавить сюжет</button>`;
                app.appendChild(btnContainer);
            }
        }

        function openStory(id) {
            const story = (state.data?.stories || ).find(s => s.id === id);
            if (!story) return;
            document.getElementById('app').innerHTML = `
                <button class="back-btn" onclick="route()">← Назад</button>
                <h1>\${escapeHtml(story.title)}</h1>
                <p><strong>Описание:</strong> \${escapeHtml(story.description)}</p>
                <div>\${formatDescription(story.text)}</div>
                \${renderGallery(story.photos)}
            `;
        }

        function renderLoginForm() {
            document.getElementById('app').innerHTML = `
                <h1 style="font-family:var(--font-display);color:var(--text-color);text-transform:uppercase;">Вход админа</h1>
                <div class="form-box">
                    <label>Пароль админа</label>
                    <input type="password" id="admin-pass" placeholder="Пароль из CONFIG">
                    <button class="btn" onclick="checkAdminPassword()">Войти</button>
                    <div id="login-error" style="color:#c9184a;margin-top:15px;text-align:center;"></div>
                </div>
            `;
        }

        function renderEditForm(story, isFullscreen = false) {
            const photosHtml = (story?.photos || ).map((url, i) => `
                <div style="position:relative;display:inline-block;margin:4px;">
                    <img src="\${escapeHtml(url)}" style="width:100px;border:1px solid #000;" onerror="this.style.display='none'">
                    <button onclick="removePhoto(\${i})" style="position:absolute;top:-5px;right:-5px;background:#000;color:#fff;border:none;padding:2px 6px;cursor:pointer;font-family:inherit;">×</button>
                </div>
            `).join('');

            const wrapperClass = isFullscreen ? 'fullscreen-editor' : '';
            const backBtn = isFullscreen ? '<button class="back-btn" onclick="route()">← Назад</button>' : '';
            const titleText = story ? 'Редактировать сюжет' : 'Новый сюжет';

            document.getElementById('app').innerHTML = `
                ${wrapperClass ? `<div class="${wrapperClass}">` : ''}
                \${backBtn}
                <h1 style="font-family:var(--font-display);color:var(--text-color);text-transform:uppercase;margin-bottom:30px;">\${titleText}</h1>
                <div class="form-box">
                    <label>Название</label>
                    <input type="text" id="story-title" placeholder="Например: Пролог: первая встреча">
                    <label>Краткое описание (для карточки)</label>
                    <input type="text" id="story-desc" placeholder="1–2 предложения">
                    <label>Полный текст сюжета</label>
                    <textarea id="story-text" placeholder="Введите текст..."></textarea>
                    <label>Фото (можно загрузить несколько)</label>
                    <input type="file" id="story-photos" multiple accept="image/*" style="margin-bottom:15px;">
                    <div id="uploaded-photos-preview" style="margin-bottom:20px;">\${photosHtml}</div>
                    ${story ? `<button class="btn btn-danger" onclick="deleteStory('${story.id}')" style="width:100%;">Удалить сюжет</button>` : ''}
                    <button class="btn btn-save" onclick="saveStory()">\${story ? 'Сохранить изменения' : 'Создать сюжет'}</button>
                </div>
                \${wrapperClass ? `</div>` : ''}
            `;

            if (story) {
                document.getElementById('story-title').value = story.title;
                document.getElementById('story-desc').value = story.description;
                document.getElementById('story-text').value = story.text || '';
            }
        }

        let tempPhotos = ;

        document.addEventListener('DOMContentLoaded', () => {
            const photosInput = document.getElementById('story-photos');
            if (photosInput) {
                photosInput.addEventListener('change', async (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;

                    const previewContainer = document.getElementById('uploaded-photos-preview');
                    previewContainer.innerHTML = '<p style="color:var(--text-color);font-family:var(--font-display);">Загружаем фото…</p>';

                    try {
                        for (const file of files) {
                            const url = await GH.uploadImage(file);
                            tempPhotos.push(url);
                        }
                        renderPhotosPreview();
                    } catch (err) {
                        console.error(err);
                        alert('Ошибка загрузки фото: ' + err.message);
                        renderPhotosPreview();
                    } finally {
                        e.target.value = '';
                    }
                });
            }
        });

        function renderPhotosPreview() {
            const container = document.getElementById('uploaded-photos-preview');
            container.innerHTML = tempPhotos.map((url, i) => `
                <div style="position:relative;display:inline-block;margin:4px;">
                    <img src="\${escapeHtml(url)}" style="width:100px;border:1px solid #000;" onerror="this.style.display='none'">
                    <button onclick="removePhoto(\${i})" style="position:absolute;top:-5px;right:-5px;background:#000;color:#fff;border:none;padding:2px 6px;cursor:pointer;font-family:inherit;">×</button>
                </div>
            `).join('');
        }

        function removePhoto(index) {
            tempPhotos.splice(index, 1);
            renderPhotosPreview();
        }

        async function saveStory() {
            const title = document.getElementById('story-title').value.trim();
            const desc = document.getElementById('story-desc').value.trim();
            const text = document.getElementById('story-text').value.trim();

            if (!title || !desc) {
                alert('Название и краткое описание обязательны');
                return;
            }

            try {
                const allPhotos = [
                    ...(state.data.stories.find(s => s.id === state.editingId)?.photos || ),
                    ...tempPhotos
                ];

                const newStory = {
                    id: state.editingId || uuid(),
                    title,
                    description: desc,
                    text,
                    photos: allPhotos,
                    preview: allPhotos || ''
                };

                let stories = state.data.stories || ;
                const existingIndex = stories.findIndex(s => s.id === newStory.id);
                if (existingIndex >= 0) {
                    stories[existingIndex] = newStory;
                } else {
                    stories.unshift(newStory);
                }

                state.data = { stories };
                await GH.updateFile(CONFIG.dataFile, state.data);

                tempPhotos = ;
                route();
                alert('Сюжет сохранён!');
            } catch (e) {
                console.error(e);
                alert('Ошибка сохранения: ' + e.message);
            }
        }

        async function deleteStory(id) {
            if (!confirm('Вы уверены, что хотите удалить этот сюжет?')) return;
            try {
                state.data.stories = (state.data.stories || ).filter(s => s.id !== id);
                await GH.updateFile(CONFIG.dataFile, state.data);
                route();
                alert('Сюжет удалён');
            } catch (e) {
                console.error(e);
                alert('Ошибка удаления: ' + e.message);
            }
        }

        function checkAdminPassword() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === CONFIG.adminPassword) {
                state.user.isAdmin = true;
                renderAdminBadge();
                route();
            } else {
                document.getElementById('login-error').textContent = 'Неверный пароль';
            }
        }

        function logout() {
            state.user.isAdmin = false;
            state.user.token = '';
            localStorage.removeItem('gh_token');
            renderAdminBadge();
            route();
        }

        async function tryAutoLogin() {
            const savedToken = localStorage.getItem('gh_token');
            if (savedToken) {
                await GH.setToken(savedToken);
                try {
                    const res = await fetch('https://api.github.com/user', { headers: GH.headers() });
                    if (res.ok) {
                        state.user.isAdmin = true;
                        renderAdminBadge();
                    } else {
                        localStorage.removeItem('gh_token');
                    }
                } catch (e) {
                    console.warn('Автовход не удался', e);
                    localStorage.removeItem('gh_token');
                }
            }
        }

        function route(mode = 'list') {
            state.mode = mode;
            switch (mode) {
                case 'list':
                    renderList();
                    break;
                case 'admin-login':
                    renderLoginForm();
                    break;
                case 'admin-panel':
                    state.editingId = null;
                    renderEditForm(null, false); // обычный режим
                    break;
                case 'fullscreen-edit':
                    // для перехода сразу в большой редактор
                    state.editingId = null;
                    renderEditForm(null, true);
                    break;
                default:
                    renderList();
            }
        }

        (async () => {
            await tryAutoLogin();
            try {
                state.data = await fetchRaw(CONFIG.dataFile);
            } catch (e) {
                console.warn('data.json не найден, создаём пустой', e);
                state.data = { stories:  };
            }
            route('list');
        })();
    </script>
</body>
</html>
